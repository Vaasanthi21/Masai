<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Notes</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 150px;
      margin-bottom: 10px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      margin-right: 10px;
      padding: 8px 12px;
    }
  </style>
</head>
<body>

  <h2>Save Your Notes</h2>
  <textarea id="noteArea" placeholder="Type your notes here..."></textarea><br>
  <button id="saveBtn">Save Notes</button>
  <button id="loadBtn">Load Notes</button>
  <button id="clearBtn">Clear Notes</button>

  <script>
    const noteArea = document.getElementById('noteArea');
    const saveBtn = document.getElementById('saveBtn');
    const loadBtn = document.getElementById('loadBtn');
    const clearBtn = document.getElementById('clearBtn');

  
    window.addEventListener('load', () => {
      const savedNotes = localStorage.getItem('userNotes');
      if (savedNotes) {
        noteArea.value = savedNotes;
      }
    });

   
    saveBtn.addEventListener('click', () => {
      const notes = noteArea.value.trim();
      if (notes === '') {
        alert('Cannot save empty notes.');
        return;
      }
      localStorage.setItem('userNotes', notes);
      alert('Notes saved successfully!');
    });

   
    loadBtn.addEventListener('click', () => {
      const savedNotes = localStorage.getItem('userNotes');
      if (savedNotes) {
        noteArea.value = savedNotes;
        alert('Notes loaded!');
      } else {
        alert('No saved notes found.');
      }
    });

    
    clearBtn.addEventListener('click', () => {
      localStorage.removeItem('userNotes');
      noteArea.value = '';
      alert('Notes cleared.');
    });
  </script>

</body>
</html>
